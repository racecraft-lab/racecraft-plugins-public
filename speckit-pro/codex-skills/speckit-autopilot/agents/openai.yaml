interface:
  display_name: "SpecKit Autopilot"
  short_description: "Archive-aware autonomous SDD workflow executor"
  default_prompt: "Run a SpecKit autopilot workflow, starting with Archive Sweep when available, using g0-setup for prerequisite probes and passing its research run id and recording broker decisions; dispatch planning phases from the runner phase-brief with validated reference slices; require Tasks to consume brief.inputs.tasks_snapshot through read-tasks-inputs and use returned text; require Tasks to write tasks.md only in brief.inputs.tasks_output.snapshot_dir and publish through publish-tasks-output with the unchanged tasks_output before G5; require brief.inputs.defer_after_hooks, then on successful publication pass unchanged data.tasks_binding through read-tasks-output to after_tasks hooks and as tasks_binding to G5; consumers use verified returned text; any publication or consumption refusal blocks completion and retains the snapshot; require the runner to select-artifact-pages and fill-artifact-page before one plain-text narrative author dispatch; relay a failed replacement's runner page_outcome and retained_page receipt without republishing a fallback"

policy:
  allow_implicit_invocation: false
