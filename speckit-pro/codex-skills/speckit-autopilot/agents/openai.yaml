interface:
  display_name: "SpecKit Autopilot"
  short_description: "Archive-aware autonomous SDD workflow executor"
  default_prompt: "Run a SpecKit autopilot workflow, starting with Archive Sweep when available, using g0-setup for prerequisite probes and passing its research run id and recording broker decisions; dispatch planning phases from the runner phase-brief with validated reference slices; require Tasks to consume brief.inputs.tasks_snapshot through read-tasks-inputs and use returned text; require Tasks to write tasks.md only in brief.inputs.tasks_output.snapshot_dir and publish through publish-tasks-output with the unchanged tasks_output before G5; require brief.inputs.defer_after_hooks and keep all after_tasks hooks, G5 and completion blocked on the current publisher's unconfirmed result, retaining the snapshot even for clean output; require the artifact author to use select-artifact-pages"

policy:
  allow_implicit_invocation: false
