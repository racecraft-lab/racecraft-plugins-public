<!doctype html><meta charset=utf-8><title>Throwaway scaffold projection</title><h1>Complete runtime tables and delimiter tampering</h1><p>Question: can adding a complete owned runtime table preserve approval while deleting its separator changes the revision? The pair is one typed write; partial or noncanonical structure stays bound.</p><div id=buttons></div><pre id=state></pre><script>const header="| Field | Value |";const cases={absent:[],complete:[header,"|---|---|"],deleted:[header],width:[header,"|---|---|---|"],alignment:[header,"|:---|---:|"]};const cells=s=>s.split("|").slice(1,-1).map(x=>x.trim());function project(lines){const out=[];for(let i=0;i<lines.length;i++){if(lines[i]===header&&i+1<lines.length){const rule=cells(lines[i+1]);if(rule.length===2&&rule.every(x=>/^-+$/.test(x))){i++;continue;}}out.push(lines[i]);}return out;}function show(name){document.getElementById("state").textContent=JSON.stringify({scenario:name,input:cases[name],projection:project(cases[name]),preservesApproval:JSON.stringify(project(cases[name]))===JSON.stringify(project(cases.absent))},null,2);}for(const name of Object.keys(cases)){const b=document.createElement("button");b.textContent=name;b.onclick=()=>show(name);document.getElementById("buttons").append(b);}show("absent");</script>
