# Scope for the python-lint CI job in .github/workflows/pr-checks.yml. Ruff is
# a dev-only CI tool, never a runtime dependency; scripts/run-python-lint.py
# pins and runs it. The rules flag real defects: pyflakes (F) for undefined
# names, unused imports, and dead assignments; bugbear (B) for patterns such as
# a zip() without an explicit strict=; and blind except (BLE), so a catch-all
# must state why it is a deliberate boundary.
#
# flake8-use-pathlib (PTH) stays off. It is style here, and its rewrites change
# behavior in path code: Path.readlink() returns a Path, not a str;
# symlink_to() reverses os.symlink's argument order; and resolve() follows
# symlinks where os.path.abspath() does not.
extend-exclude = ["dist", "specs"]
target-version = "py311"

[lint]
select = ["F", "B", "BLE"]

[lint.per-file-ignores]
# Test closures are consumed inside the loop iteration that defines them
# (subTest bodies, patched callbacks), so late binding cannot bite.
"tests/**" = ["B023"]
