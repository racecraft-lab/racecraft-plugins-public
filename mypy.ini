# Allowlist for the non-required mypy-ratchet CI job in
# .github/workflows/pr-checks.yml. Every path in `files` passes today; the job
# fails if one regresses. To add a module: from the repository root, run
# `python3 scripts/run-python-lint.py run mypy <path>`, fix every error, then
# append the path below. Never remove a path to make the job pass.
[mypy]
python_version = 3.11
mypy_path = speckit-pro
explicit_package_bases = True
# Report errors only in the listed files, not in the modules they import.
follow_imports = silent
files =
    speckit-pro/speckit_pro_runner/__init__.py,
    speckit-pro/speckit_pro_runner/__main__.py,
    speckit-pro/speckit_pro_runner/agent_inventory.py,
    speckit-pro/speckit_pro_runner/agent_materialization.py,
    speckit-pro/speckit_pro_runner/artifact_review.py,
    speckit-pro/speckit_pro_runner/execution_control.py,
    speckit-pro/speckit_pro_runner/formal/__init__.py,
    speckit-pro/speckit_pro_runner/formal/apalache.py,
    speckit-pro/speckit_pro_runner/formal/engine.py,
    speckit-pro/speckit_pro_runner/formal/evidence.py,
    speckit-pro/speckit_pro_runner/formal/helper.py,
    speckit-pro/speckit_pro_runner/formal/itf.py,
    speckit-pro/speckit_pro_runner/formal/lifecycle.py,
    speckit-pro/speckit_pro_runner/formal/native_config.py,
    speckit-pro/speckit_pro_runner/formal/process.py,
    speckit-pro/speckit_pro_runner/formal/quint.py,
    speckit-pro/speckit_pro_runner/formal/selection.py,
    speckit-pro/speckit_pro_runner/formal/tlc.py,
    speckit-pro/speckit_pro_runner/formal/traces.py,
    speckit-pro/speckit_pro_runner/gate_discovery.py,
    speckit-pro/speckit_pro_runner/gates/__init__.py,
    speckit-pro/speckit_pro_runner/gates/gate_response.py,
    speckit-pro/speckit_pro_runner/gates/registry.py,
    speckit-pro/speckit_pro_runner/gates/release.py,
    speckit-pro/speckit_pro_runner/gates/suite.py,
    speckit-pro/speckit_pro_runner/helpers/__init__.py,
    speckit-pro/speckit_pro_runner/helpers/promotion.py,
    speckit-pro/speckit_pro_runner/helpers/stack_manager.py,
    speckit-pro/speckit_pro_runner/path_utils.py,
    speckit-pro/speckit_pro_runner/task_execution.py,
    speckit-pro/speckit_pro_runner/verification_docker_entrypoint.py,
    speckit-pro/speckit_pro_runner/verification_git.py,
    scripts/build-plugin-payloads.py,
    scripts/check-pr-workflow-results.py,
    scripts/classify-docs-validation.py,
    scripts/dispatch-release-pr-checks.py,
    scripts/docs-artifact.py,
    scripts/emit-plugin-matrix.py,
    scripts/refresh-local-plugin.py,
    scripts/refresh-release-artifacts.py,
    scripts/release_note_policy.py,
    scripts/resolve_release_prs.py,
    scripts/run-plugin-evals.py,
    scripts/run-python-lint.py,
    scripts/run-runner-requests.py,
    scripts/sync-marketplace-versions.py,
    scripts/validate-release-pr-integrity.py
