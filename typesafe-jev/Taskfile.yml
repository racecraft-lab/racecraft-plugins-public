version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the evaluate binary
    cmds:
      - go build -o evaluate ./cmd/evaluate
    sources:
      - cmd/**/*.go
      - cmd/**/*.ts
      - go.mod
      - go.sum
    generates:
      - evaluate

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: Check formatting and vet
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  check:
    desc: Lint and test
    cmds:
      - task: lint
      - task: test

  install:
    desc: Build and install evaluate into the isolated Racecraft directory
    # Not `go install`: GOBIN is usually on PATH, where this binary would
    # collide with an upstream `evaluate`. Clients are pointed at this absolute
    # path instead, which is also where install.sh puts a release build.
    vars:
      INSTALL_DIR: '{{.EVALUATE_INSTALL_DIR | default (printf "%s/.local/libexec/racecraft-jev" .HOME)}}'
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - go build -trimpath -o {{.INSTALL_DIR}}/evaluate ./cmd/evaluate
      - '{{.INSTALL_DIR}}/evaluate version --verbose'

  inspect:
    desc: Open the MCP Inspector against the server
    deps: [build]
    cmds:
      - npx @modelcontextprotocol/inspector ./evaluate mcp

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy
