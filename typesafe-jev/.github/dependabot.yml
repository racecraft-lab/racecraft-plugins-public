version: 2

updates:
  # Go dependencies. The MCP SDK and Cobra are pinned in go.mod, and a security
  # advisory against either is the case that matters most here, so alerts and
  # automatic security updates are enabled on the repository as well.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
    groups:
      # One PR for the routine bumps, so CI runs once and review is one pass.
      # Major versions stay separate: they need reading, not merging.
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The toolchain directive in go.mod is deliberate. Raising the required
      # Go version is a decision about who can build this, not a dependency
      # bump, so it is made by hand.
      - dependency-name: go
      - dependency-name: toolchain

  # Workflow actions. These run with repository permissions, so a stale pinned
  # action is a supply-chain concern rather than a housekeeping one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
