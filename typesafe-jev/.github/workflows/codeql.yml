name: CodeQL

on:
  push:
    branches:
      - main
  # No branch filter. Filtering to main would skip every stacked pull request,
  # which is exactly where code arrives before it reaches main.
  pull_request:
  schedule:
    # Weekly, so a newly published query finds existing code rather than
    # waiting for the next commit. Off-peak on a Tuesday.
    - cron: "27 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload the results to the repository's security tab.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          # security-extended adds queries that are useful on code handling a
          # credential and an external endpoint, at the cost of a longer run.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:go
