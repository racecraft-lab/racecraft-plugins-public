# Dependabot configuration for racecraft-plugins-public.
# This repo is a Claude Code plugin marketplace. It tracks the GitHub Actions
# pinned in `.github/workflows/`, the docs site's pnpm dependencies, and the Go
# module in `typesafe-jev/`, the only package manifest that ships in a plugin.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # The docs site. Astro, its integrations, and the Starlight plugins move
  # together: bumping astro alone breaks them.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      astro-starlight:
        patterns:
          - "astro"
          - "astro-*"
          - "@astrojs/*"
          - "starlight-*"
      docs-site-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # typesafe-jev's Go dependencies. The MCP SDK and Cobra sit on the path that
  # handles a credential, so an advisory against either matters most here.
  - package-ecosystem: "gomod"
    directory: "/typesafe-jev"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so a compromised or
    # withdrawn version has time to be caught upstream first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR for the routine bumps. Major versions stay separate: they need
      # reading, not merging.
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The go directive in go.mod is deliberate. Raising the required Go
      # version is a decision about who can build this, not a dependency bump.
      - dependency-name: "go"
      - dependency-name: "toolchain"
