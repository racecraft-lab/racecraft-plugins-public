# Dependabot configuration for racecraft-plugins-public.
# This repo is a Claude Code plugin marketplace. It tracks the GitHub Actions
# pinned in `.github/workflows/` and the docs site's pnpm dependencies.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # The docs site is the only package manifest. Astro, its integrations, and
  # the Starlight plugins move together: bumping astro alone breaks them.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      astro-starlight:
        patterns:
          - "astro"
          - "astro-*"
          - "@astrojs/*"
          - "starlight-*"
      docs-site-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
