# PR Checks — runs plugin test suites and validates PR metadata.
#
# Triggers on pull requests targeting any branch. Draft PRs are skipped.
# Release automation can also dispatch the same checks for release-please PRs
# created or updated with GITHUB_TOKEN, because those pull_request events are
# suppressed by GitHub's recursive workflow guard.
# XPLAT-007 routes plugin validation through Python runner gates. Changed-file
# selective plugin matrices are deferred until the active Python gate owns them.
# PR titles must follow Conventional Commits format.
#
# Security notes:
# - TITLE and BASE_REF are passed via env vars, never directly interpolated
#   in run: blocks, preventing script injection (FR-013 pattern).
# - matrix.plugin is safe for direct interpolation because plugin directory
#   names are constrained to kebab-case by Constitution Principle I.

name: PR Checks
run-name: "PR Checks #${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string
      pr_title:
        description: Pull request title to validate
        required: true
        type: string
      base_ref:
        description: Base branch for changed-file detection
        required: true
        type: string
        default: main

# Top-level: no permissions granted by default.
# Each job declares only what it needs (principle of least privilege).
permissions: {}

# ─────────────────────────────────────────────────────────────────────
# Job 1: Emit the Python-gated plugin matrix
# ─────────────────────────────────────────────────────────────────────
jobs:
  detect:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.changed.outputs.plugins }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Emit Python-gated plugin matrix
        id: changed
        run: python3 scripts/emit-plugin-matrix.py

  # ───────────────────────────────────────────────────────────────────
  # Job 2: Run Python-dispatched plugin gates
  # ───────────────────────────────────────────────────────────────────
  test:
    name: "test (${{ matrix.plugin }})"
    runs-on: ubuntu-latest
    if: needs.detect.result == 'success' && needs.detect.outputs.plugins != '[]'
    needs: [detect]
    permissions:
      contents: read
    strategy:
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Report test toolchain
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: PYTHONPATH="${PLUGIN}" python3 -m speckit_pro_runner < tests/speckit-pro/unit/fixtures/runner-gates/requests/run-toolchain-preflight.json

      - name: Run test suite
        env:
          PLUGIN: ${{ matrix.plugin }}
          SPECKIT_SKIP_TOOLCHAIN_CHECK: "1"
        run: PYTHONPATH="${PLUGIN}" python3 -m speckit_pro_runner < tests/speckit-pro/unit/fixtures/runner-gates/requests/run-default-suite.json

  # ───────────────────────────────────────────────────────────────────
  # Job 3: Validate PR title against Conventional Commits format
  # ───────────────────────────────────────────────────────────────────
  validate-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check PR title and split workflow contract
        env:
          TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.pr_title }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref }}
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/unit/fixtures/runner-gates/requests/release-readiness-live-github.json

  # Required release-note contract. All event text enters through env values;
  # the Python validator never evaluates PR-controlled text as shell syntax.
  validate-release-note:
    name: validate-release-note
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release note block
        env:
          PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.pr_title }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
          PR_LABELS_JSON: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || false }}
        run: python3 scripts/compose-release-notes.py --validate-pr

  # ───────────────────────────────────────────────────────────────────
  # Job 4: Validate GitHub Actions workflow syntax and semantics
  # ───────────────────────────────────────────────────────────────────
  validate-workflows:
    name: validate-workflows
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: python3 scripts/install-actionlint.py install

      - name: Run actionlint
        run: python3 scripts/install-actionlint.py run

  # ───────────────────────────────────────────────────────────────────
  # Job 5: Validate docs-site and generated reference surfaces
  # ───────────────────────────────────────────────────────────────────
  validate-docs:
    name: validate-docs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect docs validation surfaces
        id: docs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref }}
        run: python3 scripts/classify-docs-validation.py

      - name: Set up Node
        if: steps.docs.outputs.should_validate_docs == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Enable pnpm
        if: steps.docs.outputs.should_validate_docs == 'true'
        run: corepack enable

      - name: Prepare pnpm
        if: steps.docs.outputs.should_validate_docs == 'true'
        run: corepack prepare pnpm@10.25.0 --activate

      - name: Install docs-site dependencies
        if: steps.docs.outputs.should_validate_docs == 'true'
        run: pnpm --dir docs-site install --frozen-lockfile

      - name: Report docs toolchain
        if: steps.docs.outputs.should_validate_docs == 'true'
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/unit/fixtures/runner-gates/requests/run-toolchain-preflight-docs.json

      - name: Install Playwright browsers
        if: steps.docs.outputs.validation_mode == 'full'
        run: pnpm --dir docs-site exec playwright install --with-deps chromium

      - name: Run full docs validation
        if: steps.docs.outputs.validation_mode == 'full'
        env:
          DOCS_SITE_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/docs-site-smoke-evidence
        run: pnpm --dir docs-site validate

      - name: Upload docs-site smoke evidence
        if: always() && steps.docs.outputs.validation_mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-smoke-evidence
          path: ${{ runner.temp }}/docs-site-smoke-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Run generated-reference docs validation
        if: steps.docs.outputs.validation_mode == 'reference'
        run: pnpm --dir docs-site reference:check

      - name: Run generated-reference docs quality validation
        if: steps.docs.outputs.validation_mode == 'reference'
        run: pnpm --dir docs-site validate:quality

  # ───────────────────────────────────────────────────────────────────
  # Job 6: Generated release artifacts must match the source tree.
  #         release-please bumps only source versions; the payload mirrors,
  #         marketplace registries, installed-cache fixtures, and gate
  #         evidence are regenerated by scripts/refresh-release-artifacts.py.
  #         The refresh is idempotent, so any diff after running it means the
  #         PR ships drifted artifacts (the failure mode Copilot flagged on
  #         release PR #302) and must not merge.
  # ───────────────────────────────────────────────────────────────────
  artifact-consistency:
    name: artifact-consistency
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refresh generated artifacts and fail on drift
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/refresh-release-artifacts.py --check

  # ───────────────────────────────────────────────────────────────────
  # Job 7: Sentinel aggregator — provides stable check name for branch
  #         protection. Passes if test matrix passed or was skipped.
  # ───────────────────────────────────────────────────────────────────
  validate-plugins:
    name: validate-plugins
    runs-on: ubuntu-latest
    if: always()
    needs: [detect, test, artifact-consistency]
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check plugin test results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-consistency.result }}
        run: python3 scripts/check-pr-workflow-results.py
