# OpenSSF Scorecard — scores the repository's supply-chain practices weekly and
# on every push to main, then uploads the results to code scanning as SARIF.
#
# publish_results restricts this workflow: no top-level env or defaults, no
# workflow-level write permissions, and only approved actions in the analysis
# job. Do not add run: steps here.
# https://github.com/ossf/scorecard-action#workflow-restrictions

name: Scorecard

on:
  schedule:
    - cron: "27 7 * * 1"
  push:
    branches: [main]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to the code-scanning dashboard.
      security-events: write
      # Publish the results to the OpenSSF API, which also enables the badge.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
