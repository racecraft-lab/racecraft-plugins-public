# OpenSSF Scorecard — scores the repository's supply-chain practices weekly and
# on every push to main, then uploads the results to code scanning as SARIF.
#
# publish_results restricts this workflow: no top-level env or defaults, no
# workflow-level write permissions, and only approved actions in the analysis
# job. Do not add run: steps here.
# https://github.com/ossf/scorecard-action#workflow-restrictions

name: Scorecard

on:
  schedule:
    - cron: "27 7 * * 1"
  push:
    branches: [main]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to the code-scanning dashboard.
      security-events: write
      # Publish the results to the OpenSSF API, which also enables the badge.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
