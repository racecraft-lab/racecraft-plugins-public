# Container and runner preflight for XPLAT-010.
#
# Pull requests always start this workflow so the two branch-protection
# sentinels always report. The changes job decides whether the heavyweight
# platform jobs are relevant; unrelated changes receive explicit successful
# sentinel conclusions instead of missing required-check contexts.

name: Container Preflight

env:
  PIPX_VERSION: "1.15.0"
  SPEC_KIT_VERSION: v0.8.13
  SPEC_KIT_GIT_REF: git+https://github.com/github/spec-kit.git@b2314680fce898e0a9151b37ad2535d810c93eef # v0.8.13

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      windows_x64_enabled:
        description: Run the Windows x64 advisory smoke
        required: true
        type: boolean
        default: true
      windows_arm64_enabled:
        description: Run the Windows ARM64 public-preview advisory smoke
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  changes:
    name: Detect container preflight changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_preflight: ${{ steps.changes.outputs.run_preflight }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect runner, gate, and workflow changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          evidence_dir="${RUNNER_TEMP}/container-preflight-changes"
          mkdir -p "$evidence_dir"

          run_preflight=false
          reason=unrelated_change
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_preflight=true
            reason=manual_dispatch
            printf '%s\n' workflow_dispatch > "${evidence_dir}/changed-files.txt"
          else
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$merge_base" > "${evidence_dir}/merge-base.txt"
            git diff --name-only "$merge_base" "$HEAD_SHA" > "${evidence_dir}/changed-files.txt"
            while IFS= read -r file; do
              case "$file" in
                speckit-pro/speckit_pro_runner/*|tests/speckit-pro/*|.github/workflows/*)
                  run_preflight=true
                  reason=preflight_surface_changed
                  break
                  ;;
              esac
            done < "${evidence_dir}/changed-files.txt"
          fi

          {
            echo "run_preflight=${run_preflight}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

      - name: Write change-detection evidence
        if: always()
        shell: bash
        env:
          RUN_PREFLIGHT: ${{ steps.changes.outputs.run_preflight }}
          REASON: ${{ steps.changes.outputs.reason }}
          DETECTION_OUTCOME: ${{ steps.changes.outcome }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/container-preflight-changes"
          mkdir -p "$evidence_dir"
          merge_base=""
          if [[ -f "${evidence_dir}/merge-base.txt" ]]; then
            merge_base="$(cat "${evidence_dir}/merge-base.txt")"
          fi
          printf '{"schema_version":"1.0","role":"change-detection","outcome":"%s","run_preflight":"%s","reason":"%s","merge_base":"%s"}\n' \
            "$DETECTION_OUTCOME" "$RUN_PREFLIGHT" "$REASON" "$merge_base" > "${evidence_dir}/result.json"

      - name: Upload change-detection evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-change-detection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-preflight-changes
          if-no-files-found: error
          retention-days: 14

  linux-amd64-preflight:
    name: Linux amd64 heavy preflight
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.run_preflight == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    permissions:
      contents: read
    env:
      EVIDENCE_DIR: /tmp/container-preflight-linux-amd64

    steps:
      - name: Prepare evidence directory
        if: always()
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Install container prerequisites
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run current Python preflight entrypoints
        id: entrypoints
        if: steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          requests=(
            "toolchain|tests/speckit-pro/unit/fixtures/runner-gates/requests/run-toolchain-preflight.json"
            "default-suite|tests/speckit-pro/unit/fixtures/runner-gates/requests/run-default-suite.json"
            "repository-bash-confinement|tests/speckit-pro/unit/fixtures/repository-bash-confinement/requests/repo-bash-confinement.json"
            "source-runner-release-readiness|tests/speckit-pro/unit/fixtures/runner-gates/requests/release-readiness.json"
            "installed-plugin-release-readiness|tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/release-readiness.json"
          )
          failed=0
          for item in "${requests[@]}"; do
            name="${item%%|*}"
            request="${item#*|}"
            if [[ "$name" == "default-suite" ]]; then
              SPECKIT_SKIP_TOOLCHAIN_CHECK=1 PYTHONPATH=speckit-pro python3 -m speckit_pro_runner \
                < "$request" > "${EVIDENCE_DIR}/${name}.json" 2> "${EVIDENCE_DIR}/${name}.stderr.txt"
            else
              PYTHONPATH=speckit-pro python3 -m speckit_pro_runner \
                < "$request" > "${EVIDENCE_DIR}/${name}.json" 2> "${EVIDENCE_DIR}/${name}.stderr.txt"
            fi
            rc=$?
            printf '%s\n' "$rc" > "${EVIDENCE_DIR}/${name}.exit-code.txt"
            if (( rc != 0 )); then
              failed=1
            fi
          done
          exit "$failed"

      - name: Write Linux amd64 summary evidence
        if: always()
        shell: bash
        env:
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ENTRYPOINTS_OUTCOME: ${{ steps.entrypoints.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '{"schema_version":"1.0","role":"linux-amd64","architecture":"%s","prerequisites":"%s","checkout":"%s","entrypoints":"%s","native_installed_uat":false}\n' \
            "$(uname -m)" "$PREREQUISITES_OUTCOME" "$CHECKOUT_OUTCOME" "$ENTRYPOINTS_OUTCOME" > "${EVIDENCE_DIR}/summary.json"

      - name: Upload Linux amd64 heavy evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-linux-amd64-heavy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

  linux-arm64-preflight:
    name: Linux arm64 heavy preflight
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.run_preflight == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    permissions:
      contents: read
    env:
      EVIDENCE_DIR: /tmp/container-preflight-linux-arm64

    steps:
      - name: Prepare evidence directory
        if: always()
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Install container prerequisites
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run current Python preflight entrypoints
        id: entrypoints
        if: steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          requests=(
            "toolchain|tests/speckit-pro/unit/fixtures/runner-gates/requests/run-toolchain-preflight.json"
            "default-suite|tests/speckit-pro/unit/fixtures/runner-gates/requests/run-default-suite.json"
            "repository-bash-confinement|tests/speckit-pro/unit/fixtures/repository-bash-confinement/requests/repo-bash-confinement.json"
            "source-runner-release-readiness|tests/speckit-pro/unit/fixtures/runner-gates/requests/release-readiness.json"
            "installed-plugin-release-readiness|tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/release-readiness.json"
          )
          failed=0
          for item in "${requests[@]}"; do
            name="${item%%|*}"
            request="${item#*|}"
            if [[ "$name" == "default-suite" ]]; then
              SPECKIT_SKIP_TOOLCHAIN_CHECK=1 PYTHONPATH=speckit-pro python3 -m speckit_pro_runner \
                < "$request" > "${EVIDENCE_DIR}/${name}.json" 2> "${EVIDENCE_DIR}/${name}.stderr.txt"
            else
              PYTHONPATH=speckit-pro python3 -m speckit_pro_runner \
                < "$request" > "${EVIDENCE_DIR}/${name}.json" 2> "${EVIDENCE_DIR}/${name}.stderr.txt"
            fi
            rc=$?
            printf '%s\n' "$rc" > "${EVIDENCE_DIR}/${name}.exit-code.txt"
            if (( rc != 0 )); then
              failed=1
            fi
          done
          exit "$failed"

      - name: Write Linux arm64 summary evidence
        if: always()
        shell: bash
        env:
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ENTRYPOINTS_OUTCOME: ${{ steps.entrypoints.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '{"schema_version":"1.0","role":"linux-arm64","architecture":"%s","prerequisites":"%s","checkout":"%s","entrypoints":"%s","native_installed_uat":false}\n' \
            "$(uname -m)" "$PREREQUISITES_OUTCOME" "$CHECKOUT_OUTCOME" "$ENTRYPOINTS_OUTCOME" > "${EVIDENCE_DIR}/summary.json"

      - name: Upload Linux arm64 heavy evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-linux-arm64-heavy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

  windows-availability:
    name: Record Windows hosted-label enablement
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      x64_enabled: ${{ steps.availability.outputs.x64_enabled }}
      arm64_enabled: ${{ steps.availability.outputs.arm64_enabled }}

    steps:
      - name: Resolve Windows smoke enablement
        id: availability
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_X64_ENABLED: ${{ inputs.windows_x64_enabled }}
          DISPATCH_ARM64_ENABLED: ${{ inputs.windows_arm64_enabled }}
          REPO_X64_ENABLED: ${{ vars.XPLAT_WINDOWS_X64_ENABLED }}
          REPO_ARM64_ENABLED: ${{ vars.XPLAT_WINDOWS_ARM64_ENABLED }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/container-preflight-windows-availability"
          mkdir -p "$evidence_dir/x64" "$evidence_dir/arm64"

          x64_enabled="true"
          arm64_enabled="false"
          x64_source="stable_label_default"
          arm64_source="public_preview_default"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            x64_enabled="${DISPATCH_X64_ENABLED:-true}"
            arm64_enabled="${DISPATCH_ARM64_ENABLED:-false}"
            x64_source="workflow_dispatch_input"
            arm64_source="workflow_dispatch_input"
          else
            if [[ "$REPO_X64_ENABLED" == "true" || "$REPO_X64_ENABLED" == "false" ]]; then
              x64_enabled="$REPO_X64_ENABLED"
              x64_source="repository_variable"
            fi
            if [[ "$REPO_ARM64_ENABLED" == "true" || "$REPO_ARM64_ENABLED" == "false" ]]; then
              arm64_enabled="$REPO_ARM64_ENABLED"
              arm64_source="repository_variable"
            fi
          fi
          # A repository-level disable is authoritative even for manual runs.
          if [[ "$REPO_X64_ENABLED" == "false" ]]; then
            x64_enabled="false"
            x64_source="repository_variable_disable"
          fi
          if [[ "$REPO_ARM64_ENABLED" == "false" ]]; then
            arm64_enabled="false"
            arm64_source="repository_variable_disable"
          fi

          {
            echo "x64_enabled=${x64_enabled}"
            echo "arm64_enabled=${arm64_enabled}"
          } >> "$GITHUB_OUTPUT"

          printf '{"schema_version":"1.0","role":"windows-x64","runner_label":"windows-2025","hosted_label_status":"stable","available":true,"enabled":%s,"availability_kind":"github_hosted_runner_reference","source":"%s","native_installed_uat":false}\n' \
            "$x64_enabled" "$x64_source" > "${evidence_dir}/x64/availability.json"
          printf '{"schema_version":"1.0","role":"windows-arm64","runner_label":"windows-11-arm","hosted_label_status":"public_preview","available":true,"enabled":%s,"availability_kind":"github_hosted_runner_reference","source":"%s","native_installed_uat":false}\n' \
            "$arm64_enabled" "$arm64_source" > "${evidence_dir}/arm64/availability.json"

      - name: Upload Windows x64 availability evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-windows-x64-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-preflight-windows-availability/x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows ARM64 availability evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-windows-arm64-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-preflight-windows-availability/arm64
          if-no-files-found: error
          retention-days: 14

  windows-x64-smoke:
    name: Windows x64 advisory smoke
    needs: [changes, windows-availability]
    if: needs.changes.result == 'success' && needs.changes.outputs.run_preflight == 'true' && needs.windows-availability.outputs.x64_enabled == 'true'
    continue-on-error: true
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Prepare evidence directory
        if: always()
        shell: pwsh
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/container-preflight-windows-x64
        run: New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Discover Python and dispatch hosted preflight helper
        id: smoke
        if: steps.checkout.outcome == 'success'
        shell: pwsh
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/container-preflight-windows-x64
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null

          $probeCode = 'import json,sys; print(json.dumps({"major":sys.version_info.major,"minor":sys.version_info.minor,"micro":sys.version_info.micro,"executable":sys.executable}))'
          $candidates = @(
            [pscustomobject]@{ name = "py -V:3"; executable = "py"; args = @("-V:3") },
            [pscustomobject]@{ name = "py -3"; executable = "py"; args = @("-3") },
            [pscustomobject]@{ name = "python"; executable = "python"; args = @() },
            [pscustomobject]@{ name = "python3"; executable = "python3"; args = @() }
          )
          $probeResults = @()
          $selected = $null
          foreach ($candidate in $candidates) {
            $command = Get-Command $candidate.executable -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $command) {
              $probeResults += [pscustomobject]@{ candidate = $candidate.name; status = "missing" }
              continue
            }

            $slug = $candidate.name -replace "[^A-Za-z0-9]+", "-"
            $probeStdout = Join-Path $env:EVIDENCE_DIR ("probe-{0}.json" -f $slug)
            $probeStderr = Join-Path $env:EVIDENCE_DIR ("probe-{0}.stderr.txt" -f $slug)
            [string[]]$candidateArgs = $candidate.args
            & $command.Source @candidateArgs -c $probeCode 1> $probeStdout 2> $probeStderr
            $probeExit = $LASTEXITCODE
            $version = $null
            if ($probeExit -eq 0) {
              try {
                $version = Get-Content -Raw $probeStdout | ConvertFrom-Json
              } catch {
                $version = $null
              }
            }
            $supported = $null -ne $version -and (
              [int]$version.major -gt 3 -or
              ([int]$version.major -eq 3 -and [int]$version.minor -ge 11)
            )
            $probeResults += [pscustomobject]@{
              candidate = $candidate.name
              command = $command.Source
              exit_code = $probeExit
              supported = $supported
            }
            if ($supported) {
              $selected = [pscustomobject]@{
                name = $candidate.name
                command = $command.Source
                args = [string[]]$candidate.args
              }
              break
            }
          }
          $probeResults | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8NoBOM (Join-Path $env:EVIDENCE_DIR "interpreter-probes.json")

          if (-not $selected) {
            @{schema_version = "1.0"; role = "windows-x64"; available = $true; enabled = $true; interpreter = "missing-python-3.11"; spec_kit_version_expected = $env:SPEC_KIT_VERSION; spec_kit_git_ref = $env:SPEC_KIT_GIT_REF; status = "fail"; native_installed_uat = $false} |
              ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $env:EVIDENCE_DIR "summary.json")
            exit 1
          }

          $env:PREFLIGHT_INTERPRETER_CANDIDATE = [string]$selected.name
          [string]$selectedCommand = $selected.command
          [string[]]$selectedArgs = $selected.args
          & $selectedCommand @selectedArgs tests/speckit-pro/run-hosted-windows-preflight.py --role windows-x64 --evidence-dir $env:EVIDENCE_DIR --pipx-version $env:PIPX_VERSION --spec-kit-version $env:SPEC_KIT_VERSION --spec-kit-ref $env:SPEC_KIT_GIT_REF
          exit $LASTEXITCODE

      - name: Record Windows x64 checkout failure
        if: always() && steps.checkout.outcome != 'success'
        shell: pwsh
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          EVIDENCE_DIR: ${{ runner.temp }}/container-preflight-windows-x64
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null
          @{schema_version = "1.0"; role = "windows-x64"; available = $true; enabled = $true; checkout = $env:CHECKOUT_OUTCOME; spec_kit_version_expected = $env:SPEC_KIT_VERSION; spec_kit_git_ref = $env:SPEC_KIT_GIT_REF; status = "fail"; native_installed_uat = $false} |
            ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $env:EVIDENCE_DIR "summary.json")

      - name: Upload Windows x64 smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-windows-x64-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-preflight-windows-x64
          if-no-files-found: error
          retention-days: 14

  windows-arm64-smoke:
    name: Windows ARM64 advisory smoke
    needs: [changes, windows-availability]
    if: needs.changes.result == 'success' && needs.changes.outputs.run_preflight == 'true' && needs.windows-availability.outputs.arm64_enabled == 'true'
    continue-on-error: true
    runs-on: windows-11-arm
    permissions:
      contents: read

    steps:
      - name: Prepare evidence directory
        if: always()
        shell: pwsh
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/container-preflight-windows-arm64
        run: New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Discover Python and dispatch hosted preflight helper
        id: smoke
        if: steps.checkout.outcome == 'success'
        shell: pwsh
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/container-preflight-windows-arm64
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null

          $probeCode = 'import json,sys; print(json.dumps({"major":sys.version_info.major,"minor":sys.version_info.minor,"micro":sys.version_info.micro,"executable":sys.executable}))'
          $candidates = @(
