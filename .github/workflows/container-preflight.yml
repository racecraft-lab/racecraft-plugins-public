            verdict=fail
          fi
          printf '{"schema_version":"1.0","role":"linux-arm64-required","run_preflight":"%s","heavy_result":"%s","verdict":"%s","native_installed_uat":false}\n' \
            "$RUN_PREFLIGHT" "$PREFLIGHT_RESULT" "$verdict" > "${evidence_dir}/result.json"
          [[ "$verdict" == "pass" ]]

      - name: Upload Linux arm64 required-check evidence
        if: always()
