            [pscustomobject]@{ name = "py -3"; executable = "py"; args = @("-3") },
            [pscustomobject]@{ name = "python"; executable = "python"; args = @() },
            [pscustomobject]@{ name = "python3"; executable = "python3"; args = @() }
          )
          $probeResults = @()
          $selected = $null
          foreach ($candidate in $candidates) {
            $command = Get-Command $candidate.executable -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $command) {
              $probeResults += [pscustomobject]@{ candidate = $candidate.name; status = "missing" }
              continue
            }

            $slug = $candidate.name -replace "[^A-Za-z0-9]+", "-"
            $probeStdout = Join-Path $env:EVIDENCE_DIR ("probe-{0}.json" -f $slug)
            $probeStderr = Join-Path $env:EVIDENCE_DIR ("probe-{0}.stderr.txt" -f $slug)
            [string[]]$candidateArgs = $candidate.args
            & $command.Source @candidateArgs -c $probeCode 1> $probeStdout 2> $probeStderr
            $probeExit = $LASTEXITCODE
            $version = $null
            if ($probeExit -eq 0) {
              try {
                $version = Get-Content -Raw $probeStdout | ConvertFrom-Json
              } catch {
                $version = $null
              }
            }
            $supported = $null -ne $version -and (
              [int]$version.major -gt 3 -or
              ([int]$version.major -eq 3 -and [int]$version.minor -ge 11)
            )
            $probeResults += [pscustomobject]@{
              candidate = $candidate.name
              command = $command.Source
              exit_code = $probeExit
              supported = $supported
            }
            if ($supported) {
              $selected = [pscustomobject]@{
                name = $candidate.name
                command = $command.Source
                args = [string[]]$candidate.args
              }
              break
            }
          }
          $probeResults | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8NoBOM (Join-Path $env:EVIDENCE_DIR "interpreter-probes.json")

          if (-not $selected) {
            @{schema_version = "1.0"; role = "windows-arm64"; available = $true; enabled = $true; interpreter = "missing-python-3.11"; spec_kit_version_expected = $env:SPEC_KIT_VERSION; spec_kit_git_ref = $env:SPEC_KIT_GIT_REF; status = "fail"; native_installed_uat = $false} |
              ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $env:EVIDENCE_DIR "summary.json")
            exit 1
          }

          $env:PREFLIGHT_INTERPRETER_CANDIDATE = [string]$selected.name
          [string]$selectedCommand = $selected.command
          [string[]]$selectedArgs = $selected.args
          & $selectedCommand @selectedArgs tests/speckit-pro/run-hosted-windows-preflight.py --role windows-arm64 --evidence-dir $env:EVIDENCE_DIR --pipx-version $env:PIPX_VERSION --spec-kit-version $env:SPEC_KIT_VERSION --spec-kit-ref $env:SPEC_KIT_GIT_REF
          exit $LASTEXITCODE

      - name: Record Windows ARM64 checkout failure
        if: always() && steps.checkout.outcome != 'success'
        shell: pwsh
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          EVIDENCE_DIR: ${{ runner.temp }}/container-preflight-windows-arm64
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null
          @{schema_version = "1.0"; role = "windows-arm64"; available = $true; enabled = $true; checkout = $env:CHECKOUT_OUTCOME; spec_kit_version_expected = $env:SPEC_KIT_VERSION; spec_kit_git_ref = $env:SPEC_KIT_GIT_REF; status = "fail"; native_installed_uat = $false} |
            ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $env:EVIDENCE_DIR "summary.json")

      - name: Upload Windows ARM64 smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-windows-arm64-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-preflight-windows-arm64
          if-no-files-found: error
          retention-days: 14

  linux-amd64:
    name: container-preflight-linux-amd64
    needs: [changes, linux-amd64-preflight]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Report Linux amd64 required-check verdict
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_PREFLIGHT: ${{ needs.changes.outputs.run_preflight }}
          PREFLIGHT_RESULT: ${{ needs.linux-amd64-preflight.result }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/container-preflight-linux-amd64-sentinel"
          mkdir -p "$evidence_dir"
          verdict=pass
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            verdict=fail
          elif [[ "$RUN_PREFLIGHT" == "true" && "$PREFLIGHT_RESULT" != "success" ]]; then
            verdict=fail
          elif [[ "$RUN_PREFLIGHT" != "true" && "$PREFLIGHT_RESULT" != "skipped" ]]; then
            verdict=fail
          fi
          printf '{"schema_version":"1.0","role":"linux-amd64-required","run_preflight":"%s","heavy_result":"%s","verdict":"%s","native_installed_uat":false}\n' \
            "$RUN_PREFLIGHT" "$PREFLIGHT_RESULT" "$verdict" > "${evidence_dir}/result.json"
          [[ "$verdict" == "pass" ]]

      - name: Upload Linux amd64 required-check evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-preflight-linux-amd64-required-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-preflight-linux-amd64-sentinel
          if-no-files-found: error
          retention-days: 14

