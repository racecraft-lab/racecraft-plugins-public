name: Formal qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/formal-qualification.yml'
      - 'speckit-pro/speckit_pro_runner/formal/**'
      - 'speckit-pro/skills/speckit-coach/scripts/**'
      - 'speckit-pro/skills/speckit-coach/examples/formal/**'
      - 'tests/speckit-pro/unit/test-formal-*.py'

permissions: {}

jobs:
  native:
    name: Native formal checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.11.1'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install explicitly selected pinned tools in this checkout
        run: python3 speckit-pro/skills/speckit-coach/scripts/setup-formal-tools.py --repo-root . --tool apalache --tool tlc --tool quint --apply
      - name: Execute native model and compiler cases
        run: python3 tests/speckit-pro/unit/test-formal-checkers.py --apalache-jar .specify/tools/formal/apalache-0.62.2/apalache.jar --tlc-jar .specify/tools/formal/tlc-1.7.4/tla2tools.jar --quint-root .specify/tools/formal/quint-0.32.0
      - name: Qualify setup recovery and isolated installed consumers
        run: python3 tests/speckit-pro/unit/test-formal-setup.py --native-setup
      - name: Enable the repository's pinned docs toolchain
        if: runner.os == 'macOS'
        run: corepack enable
      - name: Prepare pnpm
        if: runner.os == 'macOS'
        run: corepack prepare pnpm@10.25.0 --activate
      - name: Install locked TypeScript validation dependencies
        if: runner.os == 'macOS'
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: Check Python, TypeScript, Swift and Quint implementation traces
        if: runner.os == 'macOS'
        run: python3 tests/speckit-pro/unit/test-formal-traces.py --apalache-jar .specify/tools/formal/apalache-0.62.2/apalache.jar --quint-root .specify/tools/formal/quint-0.32.0 --typescript-compiler docs-site/node_modules/.pnpm/typescript@6.0.3/node_modules/typescript/bin/tsc --typescript-type-roots docs-site/node_modules/.pnpm/@types+node@24.13.2/node_modules/@types
      - name: Check the same implementation traces with TLC
        if: runner.os == 'macOS'
        run: python3 tests/speckit-pro/unit/test-formal-traces.py --checker tlc --apalache-jar .specify/tools/formal/apalache-0.62.2/apalache.jar --tlc-jar .specify/tools/formal/tlc-1.7.4/tla2tools.jar --typescript-compiler docs-site/node_modules/.pnpm/typescript@6.0.3/node_modules/typescript/bin/tsc --typescript-type-roots docs-site/node_modules/.pnpm/@types+node@24.13.2/node_modules/@types
