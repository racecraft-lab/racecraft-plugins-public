name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      typesafe_jev_tag:
        # Recovery only: rerun the typesafe-jev asset and notes chain for an
        # existing draft release, such as one left behind when an earlier run
        # failed after release-please drafted it. Leave empty for a normal run.
        description: Existing draft typesafe-jev release tag to recover (typesafe-jev-vX.Y.Z)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # A recovery dispatch works only on an existing draft, so it skips
    # release-please and the release PR sync entirely.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.typesafe_jev_tag == '' }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['speckit-pro--release_created'] }}
      tag_name: ${{ steps.release.outputs['speckit-pro--tag_name'] }}
      body: ${{ steps.release.outputs['speckit-pro--body'] }}
      typesafe_jev_release_created: ${{ steps.release.outputs['typesafe-jev--release_created'] }}
      typesafe_jev_tag_name: ${{ steps.release.outputs['typesafe-jev--tag_name'] }}
      typesafe_jev_body: ${{ steps.release.outputs['typesafe-jev--body'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Persist the release token so the later sync can fetch and push the
          # release branch without exposing the unsynchronized head for review.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Hold existing release PRs as draft
        env:
          BASE_REF: main
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: python3 scripts/release-pr-lifecycle.py hold

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Open the release PR with a maintainer PAT / GitHub App token when
          # one is configured, so the PR is created and its branch pushed by a
          # non-GITHUB_TOKEN actor. That lets its pull_request checks run
          # un-gated and satisfy branch protection (PRs created by GITHUB_TOKEN
          # have their checks held as action_required, leaving the release PR
          # permanently BLOCKED). When the secret is absent,
          # secrets.RELEASE_PLEASE_TOKEN is empty so the || falls through and the
          # expression resolves to github.token — the workflow keeps working
          # until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Resolve new or existing release PRs
        id: release_prs
        env:
          BASE_REF: main
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python3 scripts/resolve_release_prs.py --github-output "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.release_prs.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          # This job holds write permissions; never restore a dependency cache.
          package-manager-cache: false

      - name: Sync generated artifacts onto the release PR
        if: steps.release_prs.outputs.found == 'true'
        env:
          BASE_REF: main
          PYTHONDONTWRITEBYTECODE: "1"
          RELEASE_PRS: ${{ steps.release_prs.outputs.prs }}
        # release-please bumps only the source plugin versions and marketplace
        # registries. The helper refreshes payloads and runner trust metadata,
        # and reconciles unchanged release branches with main.
        run: python3 scripts/sync_release_pr.py

      - name: Validate installed-plugin release gates
        if: steps.release_prs.outputs.found == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/runner-invocation.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/active-runtime-guard.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/payload-completeness.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/release-readiness.json

      - name: Mark synchronized release PRs ready for review
        if: steps.release_prs.outputs.found == 'true'
        env:
          BASE_REF: main
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PRS: ${{ steps.release_prs.outputs.prs }}
        run: python3 scripts/release-pr-lifecycle.py ready

      - name: Dispatch PR Checks for release PRs
        if: steps.release_prs.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release_prs.outputs.prs }}
        run: python3 scripts/dispatch-release-pr-checks.py

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'

      - name: Verify generated test payload evidence
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/runner-gates/requests/test-payload-evidence.json

      - name: Validate post-release installed-plugin gates
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/runner-invocation.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/active-runtime-guard.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/payload-completeness.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/release-readiness.json

      - name: Set up Node
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          # This job holds write permissions; never restore a dependency cache.
          package-manager-cache: false

      - name: Enable Corepack
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: corepack enable

      - name: Activate pnpm
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: corepack prepare pnpm@10.25.0 --activate

      - name: Regenerate docs reference
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        # reference:generate is a pure node: built-in script; no node_modules needed.
        run: pnpm --dir docs-site reference:generate

      - name: Verify release artifacts are consistent
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # The release PR should already carry the generated payload,
        # marketplace and docs-reference sync.
        run: python3 scripts/refresh-release-artifacts.py --check

  capture-release-note-inputs:
    needs: release
    if: ${{ always() && needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    outputs:
      snapshot_artifact_id: ${{ steps.upload_release_snapshot.outputs['artifact-id'] }}
      snapshot_artifact_digest: ${{ steps.upload_release_snapshot.outputs['artifact-digest'] }}
      snapshot_artifact_url: ${{ steps.upload_release_snapshot.outputs['artifact-url'] }}
      snapshot_sha256: ${{ steps.capture_snapshot.outputs.snapshot_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture complete immutable release inputs
        id: capture_snapshot
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BODY: ${{ needs.release.outputs.body }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: python3 scripts/compose-release-notes.py --capture-snapshot --snapshot-output release-note-snapshot.json

      # upload-artifact v4+ artifacts are immutable. The unique run/attempt
      # name and default overwrite=false preserve the complete API input set.
      - name: Upload immutable release input snapshot
        id: upload_release_snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-note-snapshot.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  compose-release-notes:
    needs: [release, capture-release-note-inputs]
    if: ${{ always() && !cancelled() && needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    outputs:
      audit_artifact_id: ${{ steps.upload_release_audit.outputs['artifact-id'] }}
      audit_artifact_digest: ${{ steps.upload_release_audit.outputs['artifact-digest'] }}
      audit_artifact_url: ${{ steps.upload_release_audit.outputs['artifact-url'] }}
      audit_sha256: ${{ steps.compose.outputs.audit_sha256 }}
      release_body_sha256: ${{ steps.compose.outputs.release_body_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable release input snapshot
        id: download_release_snapshot
        if: ${{ always() && !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_id }}
          path: release-note-input
          digest-mismatch: error

      - name: Compose and verify public release notes
        id: compose
        if: ${{ always() && !cancelled() }}
        env:
          CAPTURE_RESULT: ${{ needs.capture-release-note-inputs.result }}
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.capture-release-note-inputs.outputs.snapshot_sha256 }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SNAPSHOT_ARTIFACT_DIGEST: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_digest }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_id }}
          SNAPSHOT_ARTIFACT_URL: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_url }}
          SNAPSHOT_DOWNLOAD_OUTCOME: ${{ steps.download_release_snapshot.outcome }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/audit-release-notes.py

      - name: Upload immutable release note audit
        id: upload_release_audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-note-audit.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record immutable audit artifact
        if: ${{ always() && steps.upload_release_audit.outcome == 'success' }}
        env:
          AUDIT_ARTIFACT_DIGEST: ${{ steps.upload_release_audit.outputs['artifact-digest'] }}
          AUDIT_ARTIFACT_ID: ${{ steps.upload_release_audit.outputs['artifact-id'] }}
          AUDIT_ARTIFACT_URL: ${{ steps.upload_release_audit.outputs['artifact-url'] }}
        run: python3 scripts/audit-release-notes.py --record-artifact

  # typesafe-jev releases as a draft with its tag already pushed. Its archives
  # are built from the tag, attached, and checked on the draft before anyone
  # can download them; only then is the release published.
  #
  # Every typesafe-jev job runs on always() and gates on its own inputs, so a
  # failure later in the release job (such as the speckit-pro release PR sync)
  # never strands a draft release-please already created.
  typesafe-jev-draft:
    needs: release
    if: ${{ always() && !cancelled() && (needs.release.outputs.typesafe_jev_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.typesafe_jev_tag != '')) }}
    permissions:
      # A draft release is visible only to a token with write access.
      contents: write
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      body: ${{ steps.resolve.outputs.body }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the typesafe-jev draft release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.typesafe_jev_tag }}
          RELEASE_BODY: ${{ needs.release.outputs.typesafe_jev_body }}
          RELEASE_TAG: ${{ needs.release.outputs.typesafe_jev_tag_name }}
        run: python3 scripts/build-typesafe-jev-release.py resolve

  typesafe-jev-assets:
    needs: typesafe-jev-draft
    if: ${{ always() && !cancelled() && needs.typesafe-jev-draft.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: typesafe-jev/go.mod
          cache-dependency-path: typesafe-jev/go.sum

      - name: Test the tagged typesafe-jev tree
        run: python3 scripts/check-go-module.py check

      - name: Build the typesafe-jev release archives
        env:
          RELEASE_TAG: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
        run: python3 scripts/build-typesafe-jev-release.py build

      - name: Attach the archives to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
        run: python3 scripts/build-typesafe-jev-release.py upload

      - name: Verify the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
        run: python3 scripts/build-typesafe-jev-release.py verify

  typesafe-jev-publish:
    needs: [typesafe-jev-draft, typesafe-jev-assets]
    if: ${{ always() && !cancelled() && needs.typesafe-jev-assets.result == 'success' }}
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
          persist-credentials: false

      - name: Publish the verified typesafe-jev release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
        run: python3 scripts/build-typesafe-jev-release.py publish

      - name: Install the published release as a user would
        env:
          RELEASE_TAG: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
        run: python3 scripts/build-typesafe-jev-release.py smoke-install

  capture-typesafe-jev-release-note-inputs:
    needs: [typesafe-jev-draft, typesafe-jev-publish]
    if: ${{ always() && needs.typesafe-jev-publish.result == 'success' }}
    permissions:
      contents: read
    outputs:
      snapshot_artifact_id: ${{ steps.upload_release_snapshot.outputs['artifact-id'] }}
      snapshot_artifact_digest: ${{ steps.upload_release_snapshot.outputs['artifact-digest'] }}
      snapshot_artifact_url: ${{ steps.upload_release_snapshot.outputs['artifact-url'] }}
      snapshot_sha256: ${{ steps.capture_snapshot.outputs.snapshot_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture complete immutable release inputs
        id: capture_snapshot
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BODY: ${{ needs.typesafe-jev-draft.outputs.body }}
          RELEASE_TAG: ${{ needs.typesafe-jev-draft.outputs.tag_name }}
        run: python3 scripts/compose-release-notes.py --capture-snapshot --snapshot-output release-note-snapshot.json

      - name: Upload immutable release input snapshot
        id: upload_release_snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-input-typesafe-jev-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-note-snapshot.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  compose-typesafe-jev-release-notes:
    needs: [typesafe-jev-draft, capture-typesafe-jev-release-note-inputs]
    if: ${{ always() && !cancelled() && needs.typesafe-jev-draft.result == 'success' }}
    permissions:
      contents: write
    outputs:
      audit_artifact_id: ${{ steps.upload_release_audit.outputs['artifact-id'] }}
      audit_artifact_digest: ${{ steps.upload_release_audit.outputs['artifact-digest'] }}
      audit_artifact_url: ${{ steps.upload_release_audit.outputs['artifact-url'] }}
      audit_sha256: ${{ steps.compose.outputs.audit_sha256 }}
      release_body_sha256: ${{ steps.compose.outputs.release_body_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable release input snapshot
        id: download_release_snapshot
        if: ${{ always() && !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.capture-typesafe-jev-release-note-inputs.outputs.snapshot_artifact_id }}
          path: release-note-input
          digest-mismatch: error

      - name: Compose and verify public release notes
        id: compose
        if: ${{ always() && !cancelled() }}
        env:
          CAPTURE_RESULT: ${{ needs.capture-typesafe-jev-release-note-inputs.result }}
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.capture-typesafe-jev-release-note-inputs.outputs.snapshot_sha256 }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SNAPSHOT_ARTIFACT_DIGEST: ${{ needs.capture-typesafe-jev-release-note-inputs.outputs.snapshot_artifact_digest }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.capture-typesafe-jev-release-note-inputs.outputs.snapshot_artifact_id }}
          SNAPSHOT_ARTIFACT_URL: ${{ needs.capture-typesafe-jev-release-note-inputs.outputs.snapshot_artifact_url }}
          SNAPSHOT_DOWNLOAD_OUTCOME: ${{ steps.download_release_snapshot.outcome }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/audit-release-notes.py

      - name: Upload immutable release note audit
        id: upload_release_audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-audit-typesafe-jev-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-note-audit.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record immutable audit artifact
        if: ${{ always() && steps.upload_release_audit.outcome == 'success' }}
        env:
          AUDIT_ARTIFACT_DIGEST: ${{ steps.upload_release_audit.outputs['artifact-digest'] }}
          AUDIT_ARTIFACT_ID: ${{ steps.upload_release_audit.outputs['artifact-id'] }}
          AUDIT_ARTIFACT_URL: ${{ steps.upload_release_audit.outputs['artifact-url'] }}
        run: python3 scripts/audit-release-notes.py --record-artifact
