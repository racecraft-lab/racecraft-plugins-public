name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['speckit-pro--release_created'] }}
      tag_name: ${{ steps.release.outputs['speckit-pro--tag_name'] }}
      body: ${{ steps.release.outputs['speckit-pro--body'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Open the release PR with a maintainer PAT / GitHub App token when
          # one is configured, so the PR is created and its branch pushed by a
          # non-GITHUB_TOKEN actor. That lets its pull_request checks run
          # un-gated and satisfy branch protection (PRs created by GITHUB_TOKEN
          # have their checks held as action_required, leaving the release PR
          # permanently BLOCKED). When the secret is absent,
          # secrets.RELEASE_PLEASE_TOKEN is empty so the || falls through and the
          # expression resolves to github.token — the workflow keeps working
          # until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Persist the same token for the release PR checkout. XPLAT-007 keeps
          # public payload-sync mutation deferred to XPLAT-008.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Resolve new or existing release PRs
        id: release_prs
        env:
          BASE_REF: main
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python3 scripts/resolve_release_prs.py --github-output "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.release_prs.outputs.found == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Sync generated artifacts onto the release PR
        if: steps.release_prs.outputs.found == 'true'
        env:
          BASE_REF: main
          PYTHONDONTWRITEBYTECODE: "1"
          RELEASE_PRS: ${{ steps.release_prs.outputs.prs }}
        # release-please bumps only the source plugin versions and marketplace
        # registries. The helper refreshes payloads, installed-cache proofs,
        # and gate evidence, and reconciles unchanged release branches with main.
        run: python3 scripts/sync_release_pr.py

      - name: Validate release PR readiness
        if: steps.release_prs.outputs.found == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/runner-gates/requests/release-readiness.json

      - name: Validate XPLAT-008 release gates
        if: steps.release_prs.outputs.found == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/runner-invocation.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/active-runtime-guard.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/payload-completeness.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/release-readiness.json

      - name: Dispatch PR Checks for release PRs
        if: steps.release_prs.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release_prs.outputs.prs }}
        run: python3 scripts/dispatch-release-pr-checks.py

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'

      - name: Verify generated test payload evidence
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/runner-gates/requests/test-payload-evidence.json

      - name: Validate post-release readiness
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/runner-gates/requests/release-readiness.json

      - name: Validate post-release XPLAT-008 gates
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: python3 scripts/run-runner-requests.py tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/runner-invocation.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/active-runtime-guard.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/payload-completeness.json tests/speckit-pro/unit/fixtures/installed-plugin-release/requests/release-readiness.json

      - name: Set up Node
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Enable Corepack
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: corepack enable

      - name: Activate pnpm
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: corepack prepare pnpm@10.25.0 --activate

      - name: Regenerate docs reference
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        # reference:generate is a pure node: built-in script; no node_modules needed.
        run: pnpm --dir docs-site reference:generate

      - name: Verify release artifacts are consistent
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # The release PR should already carry the generated payload,
        # marketplace, proof, evidence, and docs-reference sync.
        run: python3 scripts/refresh-release-artifacts.py --check

  capture-release-note-inputs:
    needs: release
    if: ${{ always() && needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    outputs:
      snapshot_artifact_id: ${{ steps.upload_release_snapshot.outputs['artifact-id'] }}
      snapshot_artifact_digest: ${{ steps.upload_release_snapshot.outputs['artifact-digest'] }}
      snapshot_artifact_url: ${{ steps.upload_release_snapshot.outputs['artifact-url'] }}
      snapshot_sha256: ${{ steps.capture_snapshot.outputs.snapshot_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Capture complete immutable release inputs
        id: capture_snapshot
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BODY: ${{ needs.release.outputs.body }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: python3 scripts/compose-release-notes.py --capture-snapshot --snapshot-output release-note-snapshot.json

      # upload-artifact v4+ artifacts are immutable. The unique run/attempt
      # name and default overwrite=false preserve the complete API input set.
      - name: Upload immutable release input snapshot
        id: upload_release_snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-note-snapshot.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  compose-release-notes:
    needs: [release, capture-release-note-inputs]
    if: ${{ always() && !cancelled() && needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    outputs:
      audit_artifact_id: ${{ steps.upload_release_audit.outputs['artifact-id'] }}
      audit_artifact_digest: ${{ steps.upload_release_audit.outputs['artifact-digest'] }}
      audit_artifact_url: ${{ steps.upload_release_audit.outputs['artifact-url'] }}
      audit_sha256: ${{ steps.compose.outputs.audit_sha256 }}
      release_body_sha256: ${{ steps.compose.outputs.release_body_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download immutable release input snapshot
        id: download_release_snapshot
        if: ${{ always() && !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_id }}
          path: release-note-input
          digest-mismatch: error

      - name: Compose and verify public release notes
        id: compose
        if: ${{ always() && !cancelled() }}
        env:
          CAPTURE_RESULT: ${{ needs.capture-release-note-inputs.result }}
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.capture-release-note-inputs.outputs.snapshot_sha256 }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SNAPSHOT_ARTIFACT_DIGEST: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_digest }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_id }}
          SNAPSHOT_ARTIFACT_URL: ${{ needs.capture-release-note-inputs.outputs.snapshot_artifact_url }}
          SNAPSHOT_DOWNLOAD_OUTCOME: ${{ steps.download_release_snapshot.outcome }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/audit-release-notes.py

      - name: Upload immutable release note audit
        id: upload_release_audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-note-audit.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record immutable audit artifact
        if: ${{ always() && steps.upload_release_audit.outcome == 'success' }}
        env:
          AUDIT_ARTIFACT_DIGEST: ${{ steps.upload_release_audit.outputs['artifact-digest'] }}
          AUDIT_ARTIFACT_ID: ${{ steps.upload_release_audit.outputs['artifact-id'] }}
          AUDIT_ARTIFACT_URL: ${{ steps.upload_release_audit.outputs['artifact-url'] }}
        run: python3 scripts/audit-release-notes.py --record-artifact
