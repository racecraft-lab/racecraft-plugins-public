name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Open the release PR with a maintainer PAT / GitHub App token when
          # one is configured, so the PR is created and its branch pushed by a
          # non-GITHUB_TOKEN actor. That lets its pull_request checks run
          # un-gated and satisfy branch protection (PRs created by GITHUB_TOKEN
          # have their checks held as action_required, leaving the release PR
          # permanently BLOCKED). When the secret is absent,
          # secrets.RELEASE_PLEASE_TOKEN is empty so the || falls through and the
          # expression resolves to github.token — the workflow keeps working
          # until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.release.outputs.prs_created == 'true'
        with:
          fetch-depth: 0
          # Persist the same token for the release PR checkout. XPLAT-007 keeps
          # public payload-sync mutation deferred to XPLAT-008.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Set up Node
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Sync release PR payloads
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-007-gates/requests/release-readiness.json

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'

      - name: Build clean plugin payloads
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-007-gates/requests/test-payload-evidence.json

      - name: Sync marketplace versions
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-007-gates/requests/release-readiness.json

      - name: Set up Node
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Regenerate docs reference
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          # reference:generate is a pure node: built-in script — no node_modules needed.
          pnpm --dir docs-site reference:generate

      - name: Verify release artifacts are consistent
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: |
          set -euo pipefail

          # Public generated payload synchronization remains an XPLAT-008
          # cutover item. This retained check is release-surface parity evidence.
          if git diff --quiet -- dist .claude-plugin/marketplace.json .agents/plugins/marketplace.json docs-site/src/content/docs/reference; then
            echo "Release artifacts are currently consistent. Public payload-sync mutation remains deferred to XPLAT-008."
            exit 0
          fi

          echo "::error::Release artifacts drifted after publishing. Public payload-sync mutation remains deferred to XPLAT-008; this retained parity check records the drift for maintainer review:"
          git --no-pager diff --stat -- dist .claude-plugin/marketplace.json .agents/plugins/marketplace.json docs-site/src/content/docs/reference
          exit 1
