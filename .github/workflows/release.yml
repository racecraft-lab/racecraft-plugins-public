name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Open the release PR with a maintainer PAT / GitHub App token when
          # one is configured, so the PR is created and its branch pushed by a
          # non-GITHUB_TOKEN actor. That lets its pull_request checks run
          # un-gated and satisfy branch protection (PRs created by GITHUB_TOKEN
          # have their checks held as action_required, leaving the release PR
          # permanently BLOCKED). When the secret is absent,
          # secrets.RELEASE_PLEASE_TOKEN is empty so the || falls through and the
          # expression resolves to github.token — the workflow keeps working
          # until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.release.outputs.prs_created == 'true'
        with:
          fetch-depth: 0
          # Persist the same token for the release PR checkout. XPLAT-007 keeps
          # public payload-sync mutation deferred to XPLAT-008.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Set up Node
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Validate release PR readiness
        if: steps.release.outputs.prs_created == 'true'
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-007-gates/requests/release-readiness.json

      - name: Validate XPLAT-008 release gates
        if: steps.release.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/runner-invocation.json
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/active-runtime-guard.json
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/payload-completeness.json
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/release-readiness.json

      - name: Sync generated artifacts onto the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          # release-please bumps only the source plugin versions and the
          # marketplace registries; refresh the generated payloads,
          # installed-cache proofs, and gate evidence so the release PR passes
          # its own gates. release-please's extra-files must NEVER pre-bump
          # dist/** or the installed-cache fixtures: the refresh script's
          # proof-snapshot heuristic assumes it is the only mutator of those
          # trees, and a pre-bumped tree makes it skip the live proof rows as
          # test sentinels (the zero-bash gate then blocks on stale hashes).
          # All artifact logic lives in the Python refresh script; this step
          # only checks out the PR branch, runs the script + docs reference,
          # and commits the result when anything changed.
          branch="$(python3 -c 'import json, os; prs = json.loads(os.environ["RELEASE_PRS"] or "[]"); pr = prs[0] if prs else {}; print(pr.get("headBranchName") or pr.get("headRefName") or "")')"
          if [ -z "$branch" ]; then
            echo "::error::release PR branch could not be resolved from release-please output"
            exit 1
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/refresh-release-artifacts.py
          pnpm --dir docs-site reference:generate
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): sync generated artifacts for release"
            git push origin "HEAD:$branch"
          else
            echo "Release artifacts already consistent; nothing to sync."
          fi

      - name: Dispatch PR Checks for release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          release_prs = json.loads(os.environ.get("RELEASE_PRS") or "[]")
          if not release_prs:
              print("prs_created=true but returned no PR metadata", file=sys.stderr)
              sys.exit(1)

          for release_pr in release_prs:
              branch = release_pr.get("headBranchName") or release_pr.get("headRefName") or ""
              number = str(release_pr.get("number") or "")
              title = release_pr.get("title") or "chore(release): release speckit-pro"
              if not branch or not number:
                  print("release PR metadata missing branch or number", file=sys.stderr)
                  sys.exit(1)
              subprocess.run(
                  [
                      "gh",
                      "workflow",
                      "run",
                      "pr-checks.yml",
                      "--ref",
                      branch,
                      "-f",
                      "pr_number=" + number,
                      "-f",
                      "pr_title=" + title,
                      "-f",
                      "base_ref=main",
                  ],
                  check=True,
              )
          PY

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'

      - name: Verify generated test payload evidence
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-007-gates/requests/test-payload-evidence.json

      - name: Validate post-release readiness
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-007-gates/requests/release-readiness.json

      - name: Validate post-release XPLAT-008 gates
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/runner-invocation.json
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/active-runtime-guard.json
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/payload-completeness.json
          PYTHONPATH=speckit-pro python3 -m speckit_pro_runner < tests/speckit-pro/layer4-scripts/fixtures/xplat-008-release/requests/release-readiness.json

      - name: Set up Node
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Regenerate docs reference
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          # reference:generate is a pure node: built-in script — no node_modules needed.
          pnpm --dir docs-site reference:generate

      - name: Verify release artifacts are consistent
        if: steps.release.outputs['speckit-pro--release_created'] == 'true'
        run: |
          set -euo pipefail

          # The release PR carries the generated payload, marketplace, and docs
          # reference sync (see "Sync generated artifacts onto the release PR"),
          # so main should already be consistent once the release PR is merged.
          if git diff --quiet -- dist .claude-plugin/marketplace.json .agents/plugins/marketplace.json docs-site/src/content/docs/reference; then
            echo "Release artifacts are consistent: the release PR carried the generated sync."
            exit 0
          fi

          echo "::error::Release artifacts drifted after publishing. Re-run the Release workflow to re-sync the release PR (Recovery Scenario 1):"
          git --no-pager diff --stat -- dist .claude-plugin/marketplace.json .agents/plugins/marketplace.json docs-site/src/content/docs/reference
          exit 1
