<!doctype html><meta charset=utf-8><title>Throwaway navigation prototype</title><h1>Generated navigation: literal text or refusal</h1><p>Question: can the existing generator keep ordinary progress updates while refusing link-shaped values? This prototype chooses numeric encoding for structural punctuation and refuses URL/email forms.</p><input id=value value=feature/demo><button onclick=render()>Preview</button><button onclick=sample(0)>Ordinary branch</button><button onclick=sample(1)>Markdown injection</button><button onclick=sample(2)>External link</button><pre id=state></pre><script>const samples=["feature/demo","[injected](local)\n|<b>","https://untrusted.invalid"];function literal(value){if(/[:@]|www\./i.test(value))return {status:"refused",reason:"link-shaped value"};return {status:"literal",rendered:value.replace(/[^A-Za-z0-9 ./-]/gu,c=>"&#"+c.codePointAt(0)+";")};}function sample(i){document.getElementById("value").value=samples[i];render();}function render(){document.getElementById("state").textContent=JSON.stringify(literal(document.getElementById("value").value),null,2);}render();</script>
